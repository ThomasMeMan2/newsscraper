{% extends "base.html" %}

{% block title %}Sources - News Aggregator{% endblock %}

{% block content %}
<div x-data="sourcesPage()" x-init="init()">
    <!-- Header -->
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold text-gray-800">News Sources</h1>
        <button @click="showAddModal = true"
                class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-colors">
            + Add Source
        </button>
    </div>

    <!-- Sources List -->
    <div class="space-y-4">
        <template x-for="(source, index) in sources" :key="index">
            <div class="bg-white rounded-xl shadow-sm p-6 border border-gray-200">
                <div class="flex items-start justify-between">
                    <div class="flex-1">
                        <div class="flex items-center space-x-3">
                            <h3 class="text-lg font-semibold text-gray-800" x-text="source.name"></h3>
                            <span class="px-2 py-0.5 text-xs font-medium rounded"
                                  :class="{
                                      'bg-blue-100 text-blue-800': source.type === 'rss',
                                      'bg-green-100 text-green-800': source.type === 'website',
                                      'bg-purple-100 text-purple-800': source.type === 'linkedin'
                                  }"
                                  x-text="source.type"></span>
                            <span x-show="!source.enabled" class="px-2 py-0.5 text-xs font-medium rounded bg-red-100 text-red-800">
                                Disabled
                            </span>
                        </div>
                        <p class="text-sm text-gray-500 mt-1 font-mono" x-text="source.url"></p>
                        <p x-show="source.note" class="text-sm text-yellow-600 mt-2" x-text="source.note"></p>
                    </div>
                    <div class="flex items-center space-x-2 ml-4">
                        <!-- Toggle Enable -->
                        <button @click="toggleSource(index)"
                                :class="source.enabled ? 'bg-green-500' : 'bg-gray-300'"
                                class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full transition-colors duration-200">
                            <span :class="source.enabled ? 'translate-x-5' : 'translate-x-0'"
                                  class="inline-block h-5 w-5 transform rounded-full bg-white shadow mt-0.5 ml-0.5 transition-transform duration-200"></span>
                        </button>
                        <!-- Edit -->
                        <button @click="editSource(index)"
                                class="p-2 text-gray-400 hover:text-indigo-600 rounded-lg hover:bg-gray-100">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                        </button>
                        <!-- Delete -->
                        <button @click="deleteSource(index)"
                                class="p-2 text-gray-400 hover:text-red-600 rounded-lg hover:bg-gray-100">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Config Details (expandable) -->
                <div x-show="source.config && Object.keys(source.config).length > 0" class="mt-4 pt-4 border-t border-gray-100">
                    <button @click="source._expanded = !source._expanded" class="text-sm text-gray-500 hover:text-gray-700 flex items-center">
                        <svg class="w-4 h-4 mr-1 transition-transform" :class="source._expanded ? 'rotate-90' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                        </svg>
                        Configuration
                    </button>
                    <div x-show="source._expanded" x-collapse class="mt-2 text-sm text-gray-600 font-mono bg-gray-50 rounded p-3">
                        <template x-for="(value, key) in source.config" :key="key">
                            <div class="flex">
                                <span class="text-gray-500 w-40" x-text="key + ':'"></span>
                                <span x-text="value"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <div x-show="sources.length === 0" class="text-center py-12 text-gray-500 bg-white rounded-xl">
            No sources configured. Click "Add Source" to get started.
        </div>
    </div>

    <!-- Add/Edit Modal -->
    <div x-show="showAddModal || editingIndex !== null" x-cloak
         class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4"
         @click.self="closeModal()">
        <div class="bg-white rounded-xl shadow-xl max-w-lg w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6">
                <h2 class="text-xl font-bold text-gray-800 mb-4" x-text="editingIndex !== null ? 'Edit Source' : 'Add Source'"></h2>

                <form @submit.prevent="saveSource()">
                    <div class="space-y-4">
                        <!-- Name -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                            <input type="text" x-model="form.name" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="My News Source">
                        </div>

                        <!-- URL -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">URL</label>
                            <input type="url" x-model="form.url" required
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="https://example.com/news">
                        </div>

                        <!-- Type -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                            <select x-model="form.type"
                                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="website">Website</option>
                                <option value="rss">RSS Feed</option>
                                <option value="linkedin">LinkedIn</option>
                            </select>
                        </div>

                        <!-- Enabled -->
                        <div class="flex items-center">
                            <input type="checkbox" x-model="form.enabled" id="enabled"
                                   class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                            <label for="enabled" class="ml-2 text-sm text-gray-700">Enabled</label>
                        </div>

                        <!-- Note -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Note (optional)</label>
                            <input type="text" x-model="form.note"
                                   class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                                   placeholder="Any notes about this source">
                        </div>

                        <!-- Website Config -->
                        <div x-show="form.type === 'website'" class="space-y-3 p-4 bg-gray-50 rounded-lg">
                            <h3 class="text-sm font-medium text-gray-700">Website Configuration</h3>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Article Selector</label>
                                <input type="text" x-model="form.config.article_selector"
                                       class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500"
                                       placeholder="article, .news-item">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Title Selector</label>
                                <input type="text" x-model="form.config.title_selector"
                                       class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500"
                                       placeholder="h2 a, .title a">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Link Selector</label>
                                <input type="text" x-model="form.config.link_selector"
                                       class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500"
                                       placeholder="h2 a, .title a">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Date Selector</label>
                                <input type="text" x-model="form.config.date_selector"
                                       class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500"
                                       placeholder="time, .date">
                            </div>
                            <div>
                                <label class="block text-xs text-gray-500 mb-1">Max Pages</label>
                                <input type="number" x-model.number="form.config.max_pages" min="1" max="10"
                                       class="w-full px-3 py-1.5 text-sm border border-gray-300 rounded focus:ring-1 focus:ring-indigo-500"
                                       placeholder="3">
                            </div>
                        </div>
                    </div>

                    <div class="flex justify-end space-x-3 mt-6">
                        <button type="button" @click="closeModal()"
                                class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200">
                            Cancel
                        </button>
                        <button type="submit"
                                class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">
                            <span x-text="editingIndex !== null ? 'Save Changes' : 'Add Source'"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function sourcesPage() {
    return {
        sources: [],
        showAddModal: false,
        editingIndex: null,
        form: {
            name: '',
            url: '',
            type: 'website',
            enabled: true,
            note: '',
            config: {}
        },

        async init() {
            await this.loadSources();
        },

        async loadSources() {
            try {
                this.sources = await api('/api/sources');
            } catch (error) {
                showToast('Failed to load sources', 'error');
            }
        },

        resetForm() {
            this.form = {
                name: '',
                url: '',
                type: 'website',
                enabled: true,
                note: '',
                config: {}
            };
        },

        editSource(index) {
            const source = this.sources[index];
            this.form = {
                name: source.name,
                url: source.url,
                type: source.type,
                enabled: source.enabled,
                note: source.note || '',
                config: { ...source.config } || {}
            };
            this.editingIndex = index;
        },

        closeModal() {
            this.showAddModal = false;
            this.editingIndex = null;
            this.resetForm();
        },

        async saveSource() {
            try {
                const data = {
                    name: this.form.name,
                    url: this.form.url,
                    type: this.form.type,
                    enabled: this.form.enabled,
                    note: this.form.note || null,
                    config: this.form.type === 'website' ? this.form.config : {}
                };

                if (this.editingIndex !== null) {
                    await api(`/api/sources/${this.editingIndex}`, {
                        method: 'PUT',
                        body: JSON.stringify(data)
                    });
                    showToast('Source updated', 'success');
                } else {
                    await api('/api/sources', {
                        method: 'POST',
                        body: JSON.stringify(data)
                    });
                    showToast('Source added', 'success');
                }

                this.closeModal();
                await this.loadSources();
            } catch (error) {
                showToast(error.message, 'error');
            }
        },

        async toggleSource(index) {
            try {
                const source = this.sources[index];
                await api(`/api/sources/${index}`, {
                    method: 'PUT',
                    body: JSON.stringify({ enabled: !source.enabled })
                });
                source.enabled = !source.enabled;
                showToast(`Source ${source.enabled ? 'enabled' : 'disabled'}`, 'success');
            } catch (error) {
                showToast(error.message, 'error');
            }
        },

        async deleteSource(index) {
            if (!confirm('Are you sure you want to delete this source?')) return;

            try {
                await api(`/api/sources/${index}`, { method: 'DELETE' });
                showToast('Source deleted', 'success');
                await this.loadSources();
            } catch (error) {
                showToast(error.message, 'error');
            }
        }
    }
}
</script>
{% endblock %}
